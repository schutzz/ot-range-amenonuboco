# 前身プロジェクト `ot-ids-verum` の電力網ラボのトポロジ層を1枚に凝縮した
# リファレンススライス。docs/manifest-schema-guide.md §8 の完全な例に対応
# (instrumentation/structuring/detection/attack は Phase 1のスコープ外の
# ため未検証のまま保持される)。Phase 1の等価性検証(Phase1-Provisioner.md
# §1)にそのまま使う。
#
# 命名注記: ファイル名・metadata.name はドメイン(電力網ラボ)を表す名前とし、
# 前身プロジェクト名("verum")を識別子として名乗らない。本プロジェクト
# (Amenonuboco)のリポジトリ内で前身の名前がファイル名に出ると、閲覧者が
# どちらのプロジェクトの資産か混同しうるため。
apiVersion: amenonuboco/v1alpha1
kind: CyberRange
metadata:
  name: power-grid-reference
  description: 前身プロジェクト ot-ids-verum の電力網ラボの代表要素を1枚に凝縮したリファレンススライス

topology:
  segments:
    - { name: cc_lan,       cidr: 10.1.10.0/24,  kind: it-core }
    - { name: wan_link,     cidr: 172.18.0.0/24, kind: wan-edge }
    - { name: sub_b_lan,    cidr: 10.1.30.0/24,  kind: ot-lan }
    - { name: sub_a_l2_lan, cidr: 10.1.20.0/24,  kind: ot-l2 }
    - { name: mirror_link,  cidr: 10.1.99.0/24,  kind: observation }
  routing:
    gateway: wan_router
  assets:
    - name: wan_router
      role: l3-router
      image: debian:bullseye-slim
      networks:
        - { segment: cc_lan,       ip: 10.1.10.254 }
        - { segment: wan_link,     ip: 172.18.0.254 }
        - { segment: sub_b_lan,    ip: 10.1.30.254 }
        - { segment: sub_a_l2_lan, ip: 10.1.20.254 }
        - { segment: mirror_link,  ip: 10.1.99.254 }

    - name: cc_scada_master
      # Phase 1はトポロジ/ルーティング層のみの等価性検証が目的であり、前身の
      # 実アプリ(scada_mtu_server.py)の再現はスコープ外だった。Phase5で
      # Signal1(ゾーン逸脱)の実証対象として、20000番ポートでTCP接続を受ける
      # だけの最小リスナーを追加する(overrides.commandはPhase1決定事項#17の
      # 通りアプリ内容としてユーザーが自由に書ける領域であり、生成器が制限する
      # 対象ではない)。python標準ライブラリのhttp.serverはHTTPとして解釈でき
      # なくても実際のTCPペイロードはワイヤに乗るため、tsharkのポートベースの
      # DNP3判定(既定でtcp/20000)には十分。前身のot_allowlist.csv上でも
      # 10.0.10.10(このIPの前身版)がDNP3送信元として唯一許可されていた資産
      # (Phase5決定事項#68)。
      role: ot-asset
      image: python:3.10-slim
      networks:
        - { segment: cc_lan, ip: 10.1.10.10 }
      overrides:
        # バックグラウンド起動(&)を裸で書くと、呼び出し元が全コマンド列を
        # &&で結合する仕組み(compose.py側)と衝突しかねない(罠ログ#010と
        # 同型の危険)。Phase3決定事項#47と同じ「( cmd & wait )」の
        # サブシェル形式にして、この資産のcommand全体が単一の安全な
        # ブロッキングコマンドになるようにする。
        command: "( python3 -m http.server 20000 & wait )"

    - name: sub_b_rtu_hmi
      # Alpine系イメージ(apk)。ルーティング生成のapk経路を検証する対象でもある
      # (Phase1決定事項#21)。
      role: ot-asset
      image: nodered/node-red:3.1.0
      networks:
        - { segment: sub_b_lan, ip: 10.1.30.10 }
      overrides:
        ports: [ "18800:1880" ]
        command: "/usr/src/node-red/entrypoint.sh"

    - name: sub_a_ied_02
      # 同上、攻撃スクリプト(send_goose_poison.py)の再現もPhase 1のスコープ外。
      role: attacker-insider
      image: python:3.10-slim
      networks:
        - { segment: sub_a_l2_lan, ip: 10.1.20.11 }
      overrides:
        command: "tail -f /dev/null"

    - name: vector
      role: detection-infra
      image: timberio/vector:0.46.0-alpine
      networks:
        - { segment: cc_lan, ip: 10.1.10.35 }

    - name: elasticsearch
      # xpack.security.enabled=false・discovery.type=single-nodeが無いと、
      # ES8系は既定でTLS必須(HTTPSのみ)起動になり、es_enrich_refresher/
      # log_structurerいずれのプレーンHTTPリクエストも到達できない
      # (Phase3決定事項#48、罠ログ#011。前身ot-ids-verumのdocker-compose.yml
      # が最初からこの3変数を設定していた設計をそのまま踏襲する)。
      role: detection-infra
      image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
      networks:
        - { segment: cc_lan, ip: 10.1.10.40 }
      overrides:
        environment:
          - "discovery.type=single-node"
          - "xpack.security.enabled=false"
          - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    - name: es_enrich_refresher
      # Alpine系(busybox)イメージ。ports/entrypointを持たない検知sidecarの例。
      role: detection-infra
      image: curlimages/curl:latest
      networks:
        - { segment: cc_lan }   # IP動的割当
      overrides:
        command: "while true; do curl -s -X POST http://elasticsearch:9200/_enrich/policy/detection_lookup_policy/_execute; sleep 60; done"

    - name: tap_observer
      # Phase2: mirror_linkへの単一接続の観測ノード。tcpdumpでミラーされた
      # トラフィックを直接確認する(前身ot-ids-verumのzeek_tap相当)。IPは動的割当。
      role: observer
      image: debian:bullseye-slim
      networks:
        - { segment: mirror_link }
      overrides:
        command: "apt-get update -qq && apt-get install -y -qq tcpdump >/dev/null 2>&1 && tcpdump -i eth0 -nn"

    - name: log_structurer
      # Phase3: 構造化パイプライン(tshark+バルクローダー)実行ノード。
      # observerとは責務分離(Phase3決定事項#41)。mirror_link(観測)+
      # cc_lan(Elasticsearchへの書き込み)へのマルチホーム接続を持つ。
      # tsharkのapt-getインストールが非対話モードを要するため、Debian系
      # イメージのみを対象とする(Phase3決定事項#44の既知の制約)。
      role: structurer
      image: debian:bullseye-slim
      networks:
        - { segment: mirror_link, ip: 10.1.99.60 }
        - { segment: cc_lan,      ip: 10.1.10.60 }

    - name: killchain_detector
      # Phase4: 検知プラグイン(Signal6キルチェーン相関)を載せるホスト資産。
      # 前身ot-ids-verumのkillchain_eql_pollerと同じく、Elasticsearchを
      # EQLでポーリングして_bulkへ書き戻すだけなので、cc_lan単独接続でよい
      # (パケット観測に依存しない=ミラーリングの境界越え制約の影響を受けない、
      # Phase4完了条件1で最初の実証対象に選んだ理由)。
      role: detection-infra
      image: python:3.11-slim
      networks:
        - { segment: cc_lan, ip: 10.1.10.80 }

    - name: zone_detector
      # Phase5: 検知プラグイン(Signal1ゾーン逸脱)を載せるホスト資産。
      # killchain_detectorと同型(cc_lan単独接続、パケット観測に依存しない)。
      role: detection-infra
      image: python:3.11-slim
      networks:
        - { segment: cc_lan, ip: 10.1.10.81 }

    - name: eval_harness
      # Phase5: 評価ハーネス(正解ラベルの記録・突き合わせ)を実行する専用資産。
      # 攻撃者ノード(sub_a_ied_02、sub_a_l2_lan接続)はcc_lan上の
      # elasticsearchへ名前解決できず、そもそも攻撃者ノード自身が正解ラベルを
      # 書き込む設計は前身のOOB自己申告(oob_redis/oob_webdis)と同じ構図に
      # なってしまうと実装時に判明した(罠ログ#017)。演習を実行した側
      # (オペレータ)が独立に記録できるよう、cc_lan接続の専用資産として分離
      # する(Phase0決定事項#13で予告した「載せる口」の実体、Phase5決定事項#69)。
      role: eval-harness
      image: python:3.11-slim
      networks:
        - { segment: cc_lan, ip: 10.1.10.90 }
      overrides:
        command: "tail -f /dev/null"

    - name: caldera_server
      # Phase4: 攻撃エミュレーションエンジン(Caldera server)。攻撃層は
      # engine.caldera.hostでこの資産を名前参照する(決定事項#53の一元化)。
      role: attack-engine
      image: python:3.11-slim
      networks:
        - { segment: cc_lan, ip: 10.1.10.70 }
      overrides:
        # Phase4検証では実際のCalderaイメージは起動せず、外部Ability/Adversaryの
        # マウントと配線が成立することの確認に留める(実際のCalderaサーバー起動は
        # イメージが重く、Phase4のスコープ=差し込み口の実証には過剰)。マウント
        # された資産を確認して常駐する軽量な代替コマンドで実証する。
        command: "ls -la /app/caldera_assets/abilities /app/caldera_assets/adversaries && tail -f /dev/null"

    - name: grafana_server
      # Phase6: 可視化エンジン(Grafana)。visualization.hostでこの資産を名前
      # 参照する(決定事項#83、attack.engine.caldera.hostと同じ一元化パターン)。
      role: visualization-engine
      image: grafana/grafana:11.1.0
      networks:
        - { segment: cc_lan, ip: 10.1.10.72 }

instrumentation:
  # Phase2決定事項#28: オプトアウト方式。exclude:[]なので、topology.segments
  # の全セグメント(mirror_link自身を除く)が自動的に観測対象になる。
  mirror_to: mirror_link
  exclude: []

structuring:
  # Phase3: es_enrich_refresherが常時cc_lan内で生成しているHTTP POSTトラフィック
  # (elasticsearchへの定期curl)を実証対象に使う。cc_lanは観測対象セグメント
  # なのでmirror_linkへミラーされ、log_structurerが捕捉してot-logs-http-*へ
  # 書き込む想定(Phase3決定事項#39・#40)。
  engine: tshark
  protocols:
    - { name: http,  output_index: ot-logs-http-* }
    - { name: dnp3,  output_index: ot-logs-dnp3-* }   # Phase5: Signal1(ゾーン逸脱)の実証対象

detection:
  # Phase4: 前身ot-ids-verumのSignal6(キルチェーン相関)を、環境定義に一切
  # 手を入れずに「1シナリオ」として差し込む(Phase4完了条件1)。プラグイン本体
  # (source)はマニフェスト外のシナリオ資産であり、プラットフォームは中身を
  # 一切解釈しない(Phase0決定事項#1)。
  plugins:
    - name: signal-6-killchain
      type: sidecar                 # Phase4はsidecarのみ実装(決定事項#55)
      host: killchain_detector      # topology.assetsの資産を名前参照(決定事項#54)
      source: ../scenarios/legacy-power-grid-signals/killchain_eql_poller.py
      requires: [ requests ]        # 生のpip installは書かない(決定事項#56)
      config:                       # 環境変数として注入される(決定事項#57)
        ES_URL: http://elasticsearch:9200
    - name: signal-1-zone-violation
      # Phase5: 前身の判定ロジック(Vector VRL内のallowlistルックアップ)を
      # sidecarへ書き直したもの(決定事項#68)。前身のot_allowlist.csvは
      # 「許可された送信元IP1件のみ」の単純な許可リストであり、Phase5計画時に
      # 想定していたセグメント間フロー方式(決定事項#64案A当初案)より単純
      # だったため、実装時にALLOWED_DNP3_SOURCESという素直なIP許可リストへ
      # 補正した(前身の実データへの忠実さを優先)。
      type: sidecar
      host: zone_detector
      source: ../scenarios/legacy-power-grid-signals/zone_violation.py
      requires: [ requests ]
      config:
        ES_URL: http://elasticsearch:9200
        ALLOWED_DNP3_SOURCES: "10.1.10.10"   # cc_scada_masterのみ許可(前身のot_allowlist.csvと同じ資産)
  # 評価ハーネスは detection の専用フィールドではなく、eval-harnessロールの
  # 資産(topology.assets の eval_harness)として表現する(決定事項#77)。
  # 正解ラベルの記録・突き合わせは、その資産へ載せたシナリオスクリプト
  # (record_ground_truth.py/evaluate_signal1.py)がオペレータ操作で担う。

attack:
  # Phase4: Caldera統合の最低ライン(Phase0決定事項#3)。engine.caldera自体が
  # 任意であり、宣言が無ければ攻撃関連の生成は一切行われない(決定事項#58)。
  engine:
    caldera:
      host: caldera_server          # topology.assetsのattack-engine資産を参照
      abilities_path: ../attack-assets/caldera/abilities
      adversaries_path: ../attack-assets/caldera/adversaries

visualization:
  # Phase6: Signal1(ゾーン逸脱)のアラートを時系列ダッシュボードで可視化する。
  # datasourcesは省略し自動生成に任せる(決定事項#81): structuring.protocols[].
  # output_index(ot-logs-http-*, ot-logs-dnp3-*)と ot-signals-* 規約
  # (決定事項#86)を束ねた1つのElasticsearchデータソースになる。
  engine: grafana
  host: grafana_server           # topology.assetsのvisualization-engine資産を参照
  dashboards:
    - ../scenarios/legacy-power-grid-signals/dashboards/signal1_zone.json
