name: CI

# マニフェストのスキーマ・生成器・シナリオ資産のユニットテストを回す。
# 実機の docker compose up は含めない(実機検証は各Phaseで手動で行う運用)。
# ここで守るのは「宣言時に弾けるべきものが弾けるか」「生成物が構造・シェル
# 構文として正しいか」「公開ガイドと実装が乖離していないか」といった、
# 実機を立てずに検証できる範囲(罠#018の反省=密トラフィックのみの検証で
# 潜在バグを見逃す、を自動テストで補う)。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -ra
