name: Deploy GUI to Pages

# gui/ をGitHub Pagesへ公開する。
# GUIはビルドステップの無い静的サイト(素のHTML/CSS/JS)のため、
# ディレクトリをそのままアップロードするだけで足りる。
#
# 公開の目的は「インストール不要でブラウザから試せる」状態を作ること。
# gui/vocab.js・gui/samples.js は platform/tools/gen_gui_vocab.py の生成物で、
# コミット済みのものをそのまま配る(生成物が古ければCI(ci.yml)のテストが
# 先に落ちるため、古いまま公開されることはない)。

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gui
      - id: deployment
        uses: actions/deploy-pages@v4
