name: Publish network-tools images

# K8-3 k8-repro-20260916-001 root-cause remediation: publishes the
# protocol-images/network-tools* images (baked iproute2/tcpdump/tshark,
# no runtime apt-get) to GHCR so formal K8 reproduction can pull an
# exact, platform-specific, digest-pinned image instead of relying on a
# live external APT repository at container-start time.
#
# Bound to Amenonuboco's own version tag scheme (not a separate
# network-tools-vN namespace) so provenance stays simple: image tag
# `vX.Y.Z` always corresponds to the source tree at that exact release.
#
# Two triggers, deliberately kept separate:
#   - `push: tags: v*`      -- the real release path: build, smoke-test,
#                              push to GHCR, report the platform-specific
#                              digest. Never runs on pull_request, so an
#                              untrusted PR cannot publish.
#   - `workflow_dispatch`   -- build-only validation, no push, no tag
#                              required. Exists so a Dockerfile/apt-source
#                              change can be verified on the real GitHub
#                              Actions runner (the same environment that
#                              once reproduced K8-3 k8-repro-20260916-001's
#                              rolling-mirror 404, independently of any
#                              K8 host) without consuming a release tag
#                              per debugging iteration -- v0.13.2/v0.13.3
#                              were both burned this way before this
#                              trigger existed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: network-tools
            context: protocol-images/network-tools
          - name: network-tools-structurer
            context: protocol-images/network-tools-structurer
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR login
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build (amd64, load for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: local/${{ matrix.image.name }}:smoke

      - name: smoke test — required binaries present, no leftover apt state assumed
        run: |
          set -eu
          case "${{ matrix.image.name }}" in
            network-tools)
              docker run --rm local/network-tools:smoke sh -c \
                'command -v ip && command -v tc && command -v tcpdump && ip -V && tc -V'
              ;;
            network-tools-structurer)
              docker run --rm local/network-tools-structurer:smoke sh -c \
                'command -v ip && command -v tc && command -v tshark && command -v python3 && tshark -v'
              ;;
          esac

      # workflow_dispatch stops here -- build + smoke test only, nothing
      # published, no GHCR credentials even acquired (GHCR login above is
      # skipped for this event). This is the non-release validation path.

      - name: build + push (amd64)
        id: push
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/schutzz/amenonuboco-${{ matrix.image.name }}:${{ github.ref_name }}

      - name: resolve platform-specific manifest digest
        # `steps.push.outputs.digest` is the digest of whatever
        # build-push-action pushed as the tag's top-level object -- with
        # provenance attestations enabled (BuildKit's current default),
        # that is an OCI *index* wrapping the real linux/amd64 image
        # manifest plus an attestation manifest, not the single-platform
        # manifest itself. A manifest-list/index digest can in principle
        # resolve differently depending on the pulling architecture, which
        # conflicts with K8's immutable-identity requirement (same digest
        # -> same bytes, unconditionally) even though this repository only
        # ever publishes one real platform today. Resolve and report the
        # inner linux/amd64 manifest digest explicitly, rather than the
        # index digest, so anyone copying this digest into a K8-3 pin gets
        # the platform-specific identity, not the index.
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -eu
          INDEX_DIGEST="${{ steps.push.outputs.digest }}"
          IMAGE="ghcr.io/schutzz/amenonuboco-${{ matrix.image.name }}"
          PLATFORM_DIGEST=$(docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(m["digest"] for m in d["manifests"] if m.get("platform",{}).get("architecture")=="amd64"))')
          echo "### ${{ matrix.image.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- index digest (do not pin this): \`$INDEX_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- platform-specific (linux/amd64) manifest digest (pin this): \`$PLATFORM_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pull reference: \`$IMAGE@$PLATFORM_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
